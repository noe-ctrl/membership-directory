<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>マッチングシート</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --line: #e7e1d7;
      --text: #222222;
      --sub: #6b6b6b;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --danger: #c0392b;
      --chip: #f3efe8;
      --shadow: 0 8px 24px rgba(0,0,0,.06);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: #3b82f6; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* ─── Login ─────────────────────────── */
    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-box {
      width: 100%; max-width: 380px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 26px 20px 20px;
    }
    .login-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .login-sub { font-size: 13px; color: var(--sub); text-align: center; line-height: 1.6; margin-bottom: 18px; }

    .input {
      width: 100%;
      border: 1px solid #d8d2c8;
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,.08); }

    .btn {
      width: 100%; margin-top: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .btn:active { opacity: 0.88; }

    .loading, .err { margin-top: 10px; text-align: center; font-size: 12px; display: none; }
    .loading { color: var(--sub); }
    .err { color: var(--danger); }

    /* ─── App shell ─────────────────────── */
    .app { display: none; min-height: 100vh; }

    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(246,244,239,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .topbar-inner { max-width: 1120px; margin: 0 auto; padding: 14px 14px 12px; }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .page-title { font-size: 22px; font-weight: 800; letter-spacing: .02em; }
    .meta { font-size: 13px; color: var(--sub); margin-top: 4px; }

    .logout {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-wrap { display: flex; gap: 8px; align-items: center; }
    .search {
      width: 100%;
      border: 1px solid #d8d2c8;
      background: #fff;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,.08); }

    /* ─── Match banner ───────────────────── */
    .match-banner {
      background: var(--accent);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .match-banner-text { font-size: 14px; font-weight: 700; }
    .match-back-btn {
      border: 1px solid rgba(255,255,255,.5);
      background: transparent;
      color: #fff;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .match-back-btn:hover { background: rgba(255,255,255,.15); }

    /* ─── Grid / Card ────────────────────── */
    .wrap { max-width: 1120px; margin: 0 auto; padding: 16px 14px 40px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 760px)  { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (min-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .photo-wrap { position: relative; background: #ece7de; }
    .photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #ece7de; }
    .photo-placeholder {
      width: 100%; aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      color: #8b8b8b; font-size: 13px;
      background: linear-gradient(135deg, #efebe3, #e5dfd3);
    }

    .type-badge {
      position: absolute; left: 12px; bottom: 12px;
      background: rgba(255,255,255,.92);
      color: #333;
      border: 1px solid rgba(0,0,0,.05);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px; font-weight: 700;
      backdrop-filter: blur(6px);
    }

    /* マッチスコアバッジ */
    .score-badge {
      position: absolute; right: 12px; top: 12px;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px; font-weight: 700;
    }

    .body { padding: 16px 16px 15px; }
    .name { font-size: 20px; font-weight: 800; line-height: 1.35; margin-bottom: 6px; }
    .headline { font-size: 14px; color: var(--sub); line-height: 1.6; margin-bottom: 12px; }

    .section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0ebe2; }
    .row { font-size: 13px; line-height: 1.7; margin-top: 6px; word-break: break-word; }
    .label { display: inline-block; min-width: 58px; font-weight: 700; color: #444; margin-right: 6px; }

    /* 電話番号リンク */
    .tel-link { color: #059669; font-weight: 600; }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; padding: 7px 10px;
      border-radius: 999px;
      background: var(--chip);
      border: 1px solid #e7e0d5;
      color: #444; line-height: 1.2;
    }

    .detail-box {
      margin-top: 8px;
      background: #faf8f4;
      border: 1px solid #efe8dc;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
    }

    /* マッチングボタン */
    .match-btn {
      display: block; width: 100%;
      margin-top: 14px;
      padding: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .match-btn:hover { background: #e0e7ff; }


    /* ─── AI社員 ─────────────────────────── */
    .ai-fab {
      position: fixed; right: 16px; bottom: 16px; z-index: 30;
      display: none; align-items: center; gap: 8px;
      border: none;
      background: var(--accent); color: #fff;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 14px; font-weight: 700;
      box-shadow: 0 10px 28px rgba(79,70,229,.35);
      cursor: pointer;
    }
    .ai-fab.show { display: inline-flex; }
    .ai-fab:active { transform: scale(.97); }

    .ai-panel {
      position: fixed; right: 16px; bottom: 16px; z-index: 40;
      width: min(420px, calc(100vw - 32px));
      height: min(660px, calc(100vh - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
      display: none; flex-direction: column; overflow: hidden;
    }
    .ai-panel.open { display: flex; }
    @media (max-width: 600px) {
      .ai-panel { right: 0; bottom: 0; width: 100vw; height: 100dvh; border-radius: 0; border: none; }
    }

    .ai-head {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .ai-title { font-size: 16px; font-weight: 800; }
    .ai-sub { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.5; }
    .ai-head-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .ai-icon-btn {
      width: 34px; height: 34px;
      border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 10px; font-size: 16px; cursor: pointer; line-height: 1;
    }
    .ai-icon-btn:hover { background: var(--chip); }

    .ai-log {
      flex: 1; overflow-y: auto;
      padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      background: #faf8f4;
      -webkit-overflow-scrolling: touch;
    }
    .ai-msg {
      max-width: 88%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .ai-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
    .ai-msg.bot  { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; }
    .ai-msg.ai-err  { align-self: flex-start; background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2; }

    .ai-typing { display: inline-flex; gap: 4px; align-items: center; height: 18px; }
    .ai-typing i {
      width: 6px; height: 6px; border-radius: 50%; background: #b8b3ab;
      animation: ai-bounce 1.2s infinite ease-in-out;
    }
    .ai-typing i:nth-child(2) { animation-delay: .15s; }
    .ai-typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes ai-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-4px); opacity: 1; } }

    .ai-recs { align-self: stretch; display: flex; flex-direction: column; gap: 8px; }
    .ai-rec {
      display: flex; gap: 10px; align-items: center;
      background: #fff; border: 1px solid #c7d2fe;
      border-radius: 14px; padding: 9px 10px;
      cursor: pointer; text-align: left; width: 100%;
      font: inherit; color: var(--text);
    }
    .ai-rec:hover { background: var(--accent-soft); }
    .ai-rec-photo {
      width: 44px; height: 44px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
      background: linear-gradient(135deg, #efebe3, #e5dfd3);
    }
    .ai-rec-body { min-width: 0; flex: 1; }
    .ai-rec-name { font-size: 14px; font-weight: 800; line-height: 1.3; }
    .ai-rec-head { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-rec-reason { font-size: 12px; color: var(--accent); margin-top: 3px; line-height: 1.4; }
    .ai-rec-all {
      align-self: flex-start;
      margin-top: 2px;
      border: 1px solid #c7d2fe; background: var(--accent-soft); color: var(--accent);
      border-radius: 10px; padding: 7px 12px;
      font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .ai-rec-all:hover { background: #e0e7ff; }

    .ai-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; background: #faf8f4; }
    .ai-chips:empty { display: none; }
    .ai-chip { cursor: pointer; font: inherit; font-size: 12px; }
    .ai-chip:hover { background: var(--accent-soft); border-color: #c7d2fe; color: var(--accent); }

    .ai-form {
      display: flex; gap: 8px; align-items: flex-end;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .ai-input {
      flex: 1; resize: none;
      border: 1px solid #d8d2c8; background: #fff;
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit; font-size: 15px; line-height: 1.45;
      max-height: 120px;
      outline: none;
    }
    .ai-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,.08); }
    .ai-send {
      border: none; background: var(--accent); color: #fff;
      border-radius: 14px; padding: 12px 16px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .ai-send:disabled { opacity: .5; cursor: default; }
    .ai-note { font-size: 11px; color: var(--sub); padding: 0 14px 10px; background: #fff; }

    .empty {
      background: #fff; border: 1px solid var(--line);
      border-radius: 18px; padding: 36px 20px;
      text-align: center; color: var(--sub);
      box-shadow: var(--shadow);
    }
    .small { font-size: 12px; color: var(--sub); }
  </style>
</head>
<body>

<!-- ─── ログイン画面 ─────────────────────────────── -->
<div id="login" class="login">
  <div class="login-box">
    <div class="login-title">会員名鑑</div>
    <div class="login-sub">パスワードを入力すると会員情報を閲覧できます。</div>
    <input
      id="pw" class="input" type="password"
      placeholder="パスワードを入力"
      onkeydown="if(event.key==='Enter') login()"
    >
    <button class="btn" onclick="login()">入る</button>
    <div id="loading" class="loading">読み込み中...</div>
    <div id="err" class="err"></div>
  </div>
</div>

<!-- ─── メイン画面 ─────────────────────────────── -->
<div id="app" class="app">

  <div class="topbar">
    <div class="topbar-inner">
      <div class="title-row">
        <div>
          <div class="page-title">会員名鑑</div>
          <div id="count" class="meta">0件</div>
        </div>
        <button class="logout" onclick="logout()">ログアウト</button>
      </div>
      <div class="search-wrap">
        <input
          id="search" class="search" type="text"
          placeholder="名前・会社名・会場・仕事内容・探している方で検索"
          oninput="render()"
        >
      </div>
    </div>
  </div>

  <!-- マッチングバナー（マッチング中のみ表示） -->
  <div id="match-banner" class="match-banner" style="display:none">
    <div class="match-banner-text">🤝 <span id="match-name"></span>さんへのマッチング結果</div>
    <button class="match-back-btn" onclick="clearMatch()">× 通常表示に戻る</button>
  </div>

  <!-- AI社員おすすめバナー（AIフィルタ中のみ表示） -->
  <div id="ai-banner" class="match-banner" style="display:none">
    <div class="match-banner-text">🤖 AI社員のおすすめ（<span id="ai-banner-count"></span>名）を表示中</div>
    <button class="match-back-btn" onclick="clearAiFilter()">× 通常表示に戻る</button>
  </div>

  <div class="wrap">
    <div id="list"></div>
  </div>
</div>

<!-- ─── AI社員 ───────────────────────────────── -->
<button id="ai-fab" class="ai-fab" onclick="openAi()" aria-label="AI社員に相談">🤖 AI社員に相談</button>

<div id="ai-panel" class="ai-panel" role="dialog" aria-label="AI社員">
  <div class="ai-head">
    <div>
      <div class="ai-title">🤖 AI社員</div>
      <div class="ai-sub">会員名鑑をもとに、人探し・マッチング・紹介文づくりをお手伝いします。</div>
    </div>
    <div class="ai-head-btns">
      <button class="ai-icon-btn" onclick="resetAi()" title="会話をリセット" aria-label="会話をリセット">↺</button>
      <button class="ai-icon-btn" onclick="closeAi()" title="閉じる" aria-label="閉じる">×</button>
    </div>
  </div>
  <div id="ai-log" class="ai-log" aria-live="polite"></div>
  <div id="ai-chips" class="ai-chips"></div>
  <form class="ai-form" onsubmit="sendAi(event)">
    <textarea
      id="ai-input" class="ai-input" rows="1"
      placeholder="例：Web制作を頼める人を探して"
      onkeydown="aiKeydown(event)"
      oninput="aiAutosize()"
    ></textarea>
    <button id="ai-send" class="ai-send" type="submit">送信</button>
  </form>
  <div class="ai-note">AIの回答は名鑑の登録内容に基づく参考情報です。連絡先は各会員カードをご確認ください。</div>
</div>

<script>
  // ★ GASをデプロイ後、発行されたURLに書き換えてください
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxvHd7itvxGO5zdIondd1nHVFaqdOCKRjJZO7O1pEx9fvJUe_BaDkXlaO8JY_W7K8o/exec';

  let allData    = [];
  let matchTarget = null;
  let _cardStore  = []; // renderCard のクリックハンドラ用一時ストア

  // ページ読み込み時：セッションにパスワードが残っていれば自動ログイン
  document.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('memberPw');
    if (saved) loginWithPassword(saved);
  });

  /* ─── UI ヘルパー ────────────────── */
  function setLoading(v) {
    document.getElementById('loading').style.display = v ? 'block' : 'none';
  }
  function setError(msg) {
    const el = document.getElementById('err');
    el.textContent = msg || 'エラーが発生しました';
    el.style.display = 'block';
  }
  function clearError() {
    document.getElementById('err').style.display = 'none';
  }

  /* ─── ログイン ───────────────────── */
  function login() {
    const pw = document.getElementById('pw').value.trim();
    if (!pw) { setError('パスワードを入力してください'); return; }
    clearError();
    loginWithPassword(pw);
  }

  async function loginWithPassword(pw) {
    setLoading(true);
    try {
      const res  = await fetch(GAS_API_URL + '?password=' + encodeURIComponent(pw));
      if (!res.ok) throw new Error('通信エラー (' + res.status + ')');
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || '読み込みに失敗しました');

      sessionStorage.setItem('memberPw', pw);
      allData = Array.isArray(json.data) ? json.data : [];
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display   = 'block';
      document.getElementById('ai-fab').classList.add('show');
      render();
    } catch (err) {
      sessionStorage.removeItem('memberPw');
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  function logout() {
    allData = []; matchTarget = null; aiFilterIds = null;
    aiHistory = [];
    document.getElementById('ai-log').innerHTML = '';
    closeAi();
    document.getElementById('ai-fab').classList.remove('show');
    sessionStorage.removeItem('memberPw');
    document.getElementById('pw').value     = '';
    document.getElementById('search').value = '';
    document.getElementById('app').style.display   = 'none';
    document.getElementById('login').style.display = 'flex';
    clearError();
  }

  /* ─── マッチング ─────────────────── */
  function calcMatchScore(target, candidate) {
    const rawKw = [
      ...(target.needs || []),
      ...(target.job   || '').split(/[\s,、。・\/「」【】＆&]+/)
    ];
    const keywords = [...new Set(
      rawKw.map(k => k.trim()).filter(k => k.length >= 2)
    )];
    if (!keywords.length) return 0;

    const text = [
      candidate.name, candidate.company, candidate.job,
      candidate.venue, candidate.detail,
      ...(candidate.needs || [])
    ].join(' ');

    return keywords.filter(kw => text.includes(kw)).length;
  }

  // カード上のボタンから呼ばれる（_cardStore のインデックスで参照）
  function _handleMatch(idx) {
    matchTarget = _cardStore[idx];
    aiFilterIds = null;
    document.getElementById('search').value = '';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function clearMatch() {
    matchTarget = null;
    render();
  }

  /* ─── 描画 ───────────────────────── */
  function getSearchText(item) {
    return [
      item.name, item.company, item.venue, item.job,
      item.email, item.tel, item.facebook, item.lineId,
      item.detail, item.type, ...(item.needs || [])
    ].join(' ').toLowerCase();
  }

  function render() {
    _cardStore = [];
    const q = (document.getElementById('search').value || '').trim().toLowerCase();

    let displayData;
    const aiBanner = document.getElementById('ai-banner');
    if (aiFilterIds) {
      const idSet = new Set(aiFilterIds);
      displayData = allData
        .map((m, i) => ({ ...m, _score: null, _aiId: 'M' + (i + 1) }))
        .filter(m => idSet.has(m._aiId))
        .filter(m => !q || getSearchText(m).includes(q));

      aiBanner.style.display = 'flex';
      document.getElementById('ai-banner-count').textContent = aiFilterIds.length;
      document.getElementById('match-banner').style.display = 'none';
    } else if (matchTarget) {
      aiBanner.style.display = 'none';
      displayData = allData
        .filter(m => !(m.name === matchTarget.name && m.email === matchTarget.email))
        .map(m => ({ ...m, _score: calcMatchScore(matchTarget, m) }))
        .sort((a, b) => b._score - a._score)
        .filter(m => !q || getSearchText(m).includes(q));

      document.getElementById('match-banner').style.display = 'flex';
      document.getElementById('match-name').textContent = matchTarget.name;
    } else {
      aiBanner.style.display = 'none';
      displayData = allData
        .map(m => ({ ...m, _score: null }))
        .filter(m => !q || getSearchText(m).includes(q));

      document.getElementById('match-banner').style.display = 'none';
    }

    document.getElementById('count').textContent = aiFilterIds
      ? 'AI社員のおすすめ: ' + displayData.length + '件'
      : matchTarget
        ? 'マッチング: ' + displayData.length + '件'
        : displayData.length + '件';

    document.getElementById('list').innerHTML = displayData.length
      ? '<div class="grid">' + displayData.map(renderCard).join('') + '</div>'
      : '<div class="empty">該当する会員が見つかりませんでした。</div>';
  }

  /* ─── HTML エスケープ ─────────────── */
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function linkify(url) {
    const s = esc(url);
    return '<a href="' + s + '" target="_blank" rel="noopener noreferrer">' + s + '</a>';
  }

  /* ─── カード描画 ─────────────────── */
  function renderCard(item) {
    const idx = _cardStore.length;
    _cardStore.push(item);

    // マッチングスコアバッジ（マッチモードかつスコア > 0 のみ）
    const scoreBadge = (item._score !== null && item._score > 0)
      ? '<div class="score-badge">🤝 ' + item._score + '件一致</div>'
      : '';

    const badges = (item.type ? '<div class="type-badge">' + esc(item.type) + '</div>' : '') + scoreBadge;

    const photo = item.photo
      ? '<div class="photo-wrap"><img class="photo" src="' + esc(item.photo) + '" alt="' + esc(item.name) + '" loading="lazy">' + badges + '</div>'
      : '<div class="photo-wrap"><div class="photo-placeholder">写真未登録</div>' + badges + '</div>';

    const headline = [item.company, item.job].filter(Boolean).map(esc).join(' / ') || '&nbsp;';

    const venue = item.venue
      ? '<div class="row"><span class="label">会場</span>' + esc(item.venue) + '</div>'
      : '';
    const email = item.email
      ? '<div class="row"><span class="label">Mail</span><a href="mailto:' + esc(item.email) + '">' + esc(item.email) + '</a></div>'
      : '';
    // tel: リンク（数字と+のみに正規化してhrefに使用）
    const tel = item.tel
      ? '<div class="row"><span class="label">TEL</span><a href="tel:' + esc(item.tel.replace(/[^\d+]/g, '')) + '" class="tel-link">' + esc(item.tel) + '</a></div>'
      : '';
    const facebook = item.facebook
      ? '<div class="row"><span class="label">FB</span>' + linkify(item.facebook) + '</div>'
      : '';
    const lineId = item.lineId
      ? '<div class="row"><span class="label">LINE</span>' + esc(item.lineId) + '</div>'
      : '';

    const chips = (item.needs && item.needs.length)
      ? '<div class="section"><div class="row"><span class="label">探している方</span></div>'
        + '<div class="chips">' + item.needs.map(n => '<span class="chip">' + esc(n) + '</span>').join('') + '</div></div>'
      : '';

    const detail = item.detail
      ? '<div class="section"><div class="row"><span class="label">内容</span></div><div class="detail-box">' + esc(item.detail) + '</div></div>'
      : '';

    const timestamp = item.timestamp
      ? '<div class="section"><div class="small">更新日時: ' + esc(item.timestamp) + '</div></div>'
      : '';

    // マッチング中は「相性を探す」ボタンを非表示（マッチ結果画面なので不要）
    const matchBtn = !matchTarget
      ? '<button class="match-btn" onclick="_handleMatch(' + idx + ')">🔍 相性の良い人を探す</button>'
      : '';

    return '<div class="card">'
      + photo
      + '<div class="body">'
      + '<div class="name">' + esc(item.name || '') + '</div>'
      + '<div class="headline">' + headline + '</div>'
      + '<div class="section">' + venue + email + tel + facebook + lineId + '</div>'
      + chips + detail + timestamp + matchBtn
      + '</div></div>';
  }

  /* ─── AI社員 ─────────────────────────── */
  let aiHistory   = [];     // {role:'user'|'assistant', content}
  let aiPending   = false;
  let aiFilterIds = null;   // 一覧をAIのおすすめだけに絞る: ['M3', ...]

  const AI_QUICK_PROMPTS = [
    'Web制作を頼める人を探して',
    '集客・マーケティングが得意な人は？',
    '相性の良い会員同士を組み合わせて',
    '自己紹介文の作成を手伝って'
  ];
  const AI_WELCOME =
    'こんにちは！AI社員です🤖\n' +
    '会員名鑑をもとに「○○ができる人を探して」「○○さんと相性の良い人は？」「紹介文を作って」などのご相談に対応します。\n' +
    'お気軽にどうぞ！';

  function openAi() {
    document.getElementById('ai-panel').classList.add('open');
    document.getElementById('ai-fab').classList.remove('show');
    if (!aiHistory.length && !document.getElementById('ai-log').children.length) {
      appendAiMsg('bot', AI_WELCOME);
      renderAiChips();
    }
    if (window.matchMedia('(min-width: 601px)').matches) {
      document.getElementById('ai-input').focus();
    }
  }
  function closeAi() {
    document.getElementById('ai-panel').classList.remove('open');
    if (allData.length) document.getElementById('ai-fab').classList.add('show');
  }
  function resetAi() {
    if (aiPending) return;
    aiHistory = [];
    document.getElementById('ai-log').innerHTML = '';
    appendAiMsg('bot', AI_WELCOME);
    renderAiChips();
  }

  function renderAiChips() {
    document.getElementById('ai-chips').innerHTML = AI_QUICK_PROMPTS
      .map(q => '<button type="button" class="chip ai-chip" onclick="quickAi(this)">' + esc(q) + '</button>')
      .join('');
  }
  function quickAi(btn) {
    document.getElementById('ai-input').value = btn.textContent;
    sendAi();
  }
  function aiKeydown(e) {
    // 日本語IMEの変換確定Enterでは送信しない（isComposing / keyCode 229）
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendAi();
    }
  }
  function aiAutosize() {
    const el = document.getElementById('ai-input');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
  function setAiPending(v) {
    aiPending = v;
    document.getElementById('ai-send').disabled = v;
    document.getElementById('ai-input').disabled = v;
  }
  function scrollAiLog() {
    const log = document.getElementById('ai-log');
    log.scrollTop = log.scrollHeight;
  }

  function appendAiMsg(kind, text, recommended) {
    const log = document.getElementById('ai-log');
    const el  = document.createElement('div');
    el.className = 'ai-msg ' + kind;
    el.textContent = text;
    log.appendChild(el);

    if (recommended && recommended.length) {
      const wrap = document.createElement('div');
      wrap.className = 'ai-recs';
      wrap.innerHTML = recommended.map(renderAiRec).join('')
        + '<button type="button" class="ai-rec-all" onclick="applyAiFilter(' + esc(JSON.stringify(recommended.map(r => r.id))) + ')">📋 この' + recommended.length + '名を一覧で表示</button>';
      log.appendChild(wrap);
    }
    scrollAiLog();
    return el;
  }
  function appendAiTyping() {
    const log = document.getElementById('ai-log');
    const el  = document.createElement('div');
    el.className = 'ai-msg bot';
    el.innerHTML = '<span class="ai-typing"><i></i><i></i><i></i></span>';
    log.appendChild(el);
    scrollAiLog();
    return el;
  }

  function aiMemberById(id) {
    const idx = parseInt(String(id).replace(/^M/, ''), 10) - 1;
    return (idx >= 0 && idx < allData.length) ? allData[idx] : null;
  }
  function renderAiRec(rec) {
    const m = aiMemberById(rec.id);
    if (!m) return '';
    const photo = m.photo
      ? '<img class="ai-rec-photo" src="' + esc(m.photo) + '" alt="" loading="lazy">'
      : '<div class="ai-rec-photo"></div>';
    const head = [m.company, m.job].filter(Boolean).map(esc).join(' / ');
    return '<button type="button" class="ai-rec" onclick="applyAiFilter([' + esc(JSON.stringify(rec.id)) + '])">'
      + photo
      + '<div class="ai-rec-body">'
      +   '<div class="ai-rec-name">' + esc(m.name) + '</div>'
      +   (head ? '<div class="ai-rec-head">' + head + '</div>' : '')
      +   (rec.reason ? '<div class="ai-rec-reason">💡 ' + esc(rec.reason) + '</div>' : '')
      + '</div></button>';
  }

  // AIのおすすめだけを一覧に表示
  function applyAiFilter(ids) {
    aiFilterIds = Array.isArray(ids) ? ids : [ids];
    matchTarget = null;
    document.getElementById('search').value = '';
    render();
    closeAi();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function clearAiFilter() {
    aiFilterIds = null;
    render();
  }

  // AIに渡す会員情報（連絡先・写真は送らない）
  function aiMemberPayload(m) {
    return {
      name: m.name, company: m.company, job: m.job,
      type: m.type, venue: m.venue, needs: m.needs, detail: m.detail
    };
  }

  async function sendAi(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (aiPending) return;

    const input = document.getElementById('ai-input');
    const text  = input.value.trim();
    if (!text) return;

    const pw = sessionStorage.getItem('memberPw');
    if (!pw) { appendAiMsg('ai-err', 'セッションが切れました。もう一度ログインしてください。'); return; }

    input.value = '';
    aiAutosize();
    document.getElementById('ai-chips').innerHTML = '';
    appendAiMsg('user', text);
    aiHistory.push({ role: 'user', content: text });

    setAiPending(true);
    const typing = appendAiTyping();
    try {
      // GASのdoPostへ。Content-Typeを付けない（プリフライト回避、GAS側はtext/plainとして受ける）
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action:   'chat',
          password: pw,
          members:  allData.map(aiMemberPayload),
          messages: aiHistory.slice(-12)
        })
      });
      const raw = await res.text();
      let json;
      try { json = JSON.parse(raw); }
      catch (_) {
        throw new Error('AI社員はまだ利用できません。管理者の方は gas/ai-employee.gs を GAS プロジェクトに追加し、再デプロイしてください。');
      }
      if (!json.ok) throw new Error(json.error || 'AI社員との通信に失敗しました');

      typing.remove();
      aiHistory.push({ role: 'assistant', content: json.reply || '' });
      appendAiMsg('bot', json.reply || '（回答を取得できませんでした）', json.recommended || []);
    } catch (err) {
      typing.remove();
      aiHistory.pop(); // 失敗した質問は履歴から外し、再送しやすくする
      appendAiMsg('ai-err', err.message || 'エラーが発生しました');
    } finally {
      setAiPending(false);
      if (window.matchMedia('(min-width: 601px)').matches) input.focus();
    }
  }
</script>
