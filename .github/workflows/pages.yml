# main ブランチに push されたら、家計簿のテストを実行してからリポジトリ全体を GitHub Pages に公開する。
# 初回はリポジトリの Settings → Pages で「Source: GitHub Actions」を選ぶ
# （configure-pages の enablement で自動有効化を試みるが、権限により手動が必要な場合がある）。
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node kakeibo/test/e2e.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
